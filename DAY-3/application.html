<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application</title>
  </head>
  <body>
    <main>
      <h1>Application Form:</h1>
      <form>
        <ol>
          <li aria-current="step">step 1</li>
          <li>step 2</li>
          <li>step 3</li>
        </ol>
        <fieldset>
          <legend>Personal Information</legend>

          <label for="name">Name:*</label>
          <input type="text" id="name" required />
          <br />
          <br />
          <label for="mail">Email:*</label>
          <input type="email" id="mail" required />
          <br />
          <br />
          <label for="phone">Phone:</label>
          <input type="tel" id="phone" />
          <br />
          <br />
          <label for="linkedIn">Linkedin URL:</label>
          <input type="url" id="linkedIn" />
          
        </fieldset>
        <br />
       
        <fieldset>
          <legend>Work Experience:</legend>
          <label for="currentRole">Current Role:</label>
          <input type="text" id="currentRole" />
          <br />
          <br />
          <label for="currentCompany">Current Company:</label>
          <input type="text" id="currentCompany" />
          <br />
          <br />
          <label for="experience">Year of Experience:</label>
          <input type="number" id="experience" />
          <br />
          <br />
          <label for="keyAchievements">Enter key achievements</label>
          <textarea id="keyAchievements" placeholder="Max 500 characters"> </textarea>
        </fieldset>
        <br />
        <fieldset>
          <legend>Documents:</legend>
          <label for="cv">CV:</label>
          <input type="file" id="cv" accept=".pdf,.docx" />
          <br />
          <br />
          <label for="coverLetter">Cover Letter:</label>
          <input type="file" id="coverLetter" />
          <br />
          <br />
          <label for="portfolioUrl">Portfolio URL:</label>
          <input type="url" id="portfolioUrl" />
          <br />
          <br />
        </fieldset>
      </form>
    </main>
  </body>
</html>
