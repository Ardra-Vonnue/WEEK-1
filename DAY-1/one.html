<!DOCTYPE html><!--tells the browser to use standard mode-->
<html lang="en"><!--<html> is the root element and lang defines the main language of the document-->
    <head><!--contains all the metadata for the site-->
        <meta charset="UTF-8"><!--character encoding declaration,it enables the one- to four-byte conversion of all characters-->
        <meta name="viewport" content="width=device-width,initial scale=1.0">
        <!--enables controlling a viewport's size and scale,make the site responsive by making the width of the content width of the screen and initial scale sets initial zoom level  when the page is first loaded by the browser-->
        <title>Doc1</title><!--define title of the webpage-->
    </head>
    <body>
    </body>
</html>
